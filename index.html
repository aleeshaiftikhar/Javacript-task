<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Tasks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <div class="input-row">
            <label for="firstBox">Enter First Number</label>
            <input type="text" id="firstBox">
        </div>

        <div class="input-row">
            <label for="secondBox">Enter Second Number</label>
            <input type="text" id="secondBox">
        </div>

        <div class="input-row result-row">
            <label for="resultBox">Result</label>
            <input type="text" id="resultBox" readonly>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
